<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bills Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#cfd6dd;--acc:#0f5c6e;--acc-ink:#fff;--stamp:#a8261d}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e6ecf1;--mute:#93a1ae;--line:#2c3a46;--acc:#4fb3c8;--acc-ink:#07222a;--stamp:#ff8a80}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.search{font-size:17px;padding:12px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:6px}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:500}
button:disabled{opacity:.5;cursor:wait}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{font-weight:600;font-variant-numeric:tabular-nums}
.ref{display:inline-block;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:4px;padding:0 6px;font-weight:600;font-size:13px;margin-right:6px}
.meta{color:var(--mute);font-size:13px}
.count{color:var(--mute);margin:10px 2px}
dialog{width:min(960px,96vw);height:92vh;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.dh b{flex:1 1 200px}
#pages{flex:1;overflow:auto;background:#888;padding:8px}
#pages canvas{display:block;height:auto;max-width:100%;margin:0 auto 8px;background:#fff}
.msg{padding:8px 10px;border-radius:6px;margin-top:8px;background:var(--bg)}
.hide{display:none}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .date{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<div class="bar"><h1>Bills Register</h1><button id="cfgBtn" class="hide">Settings</button></div>

<section id="setup" class="card hide">
  <p><b>First-time setup.</b> Bills are stored in your private GitHub repo. This page holds no bill data.</p>
  <div class="grid">
    <div><label for="repo">Private repo (owner/name)</label><input id="repo" placeholder="hmsengineering/bills-data"></div>
    <div><label for="tok">GitHub token (Contents: read and write)</label><input id="tok" type="password" autocomplete="off"></div>
  </div>
  <p><button id="saveCfg" class="p">Save and open</button></p>
  <div id="setupMsg" class="msg hide"></div>
</section>

<section id="app" class="hide">
  <div class="card">
    <input id="q" class="search" type="search" placeholder="Type anything: area, engineer, JR or JO number, date, notes…" autocomplete="off">
    <div class="grid" style="margin-top:10px">
      <div><label for="fArea">Area</label><select id="fArea"></select></div>
      <div><label for="fEng">Sub-engineer</label><select id="fEng"></select></div>
      <div><label for="fFrom">From date</label><input id="fFrom" type="date"></div>
      <div><label for="fTo">To date</label><input id="fTo" type="date"></div>
    </div>
    <p style="margin:10px 0 0"><button id="clr">Clear filters</button> <button id="addBtn" class="p">Add bill</button></p>
  </div>

  <div id="addCard" class="card hide">
    <b>Add bill</b>
    <div class="grid" style="margin-top:10px">
      <div><label for="aDate">Date</label><input id="aDate" type="date"></div>
      <div><label for="aJr">JR number</label><input id="aJr"></div>
      <div><label for="aJo">JO number</label><input id="aJo"></div>
      <div><label for="aArea">Area</label><input id="aArea" list="dArea"></div>
      <div><label for="aEng">Sub-engineer</label><input id="aEng" list="dEng"></div>
    </div>
    <datalist id="dArea"></datalist><datalist id="dEng"></datalist>
    <div style="margin-top:10px"><label for="aNotes">Notes (optional)</label><textarea id="aNotes" rows="2"></textarea></div>
    <div style="margin-top:10px"><label for="aFile">Scan: one PDF, or one or more photos (photos are compressed into a PDF)</label><input id="aFile" type="file" accept="application/pdf,image/*" multiple></div>
    <p><button id="aSave" class="p">Save bill</button> <button id="aCancel">Cancel</button></p>
    <div id="aMsg" class="msg hide"></div>
  </div>

  <div id="count" class="count"></div>
  <div id="list" class="card"></div>
</section>

<dialog id="dlg">
  <div class="dh"><b id="dTitle"></b>
    <button id="dDown" class="p">Download PDF</button>
    <button id="dWa">Share on WhatsApp</button>
    <button id="dTab">Open in new tab</button>
    <button id="dClose">Close</button></div>
  <div id="pages"></div>
</dialog>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfg={},bills=[],cur=null,curBlob=null,curUrl=null;
try{cfg=JSON.parse(localStorage.getItem('billsCfg')||'{}')}catch(e){}

const api=(path,opt={})=>fetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+path,{...opt,headers:{Authorization:'Bearer '+cfg.tok,Accept:'application/vnd.github+json',...(opt.headers||{})}});
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
const txt2b64=t=>{const u=new TextEncoder().encode(t);let s='';u.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const b642txt=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const fmt=d=>d?d.split('-').reverse().join('-'):'';
const show=(el,m)=>{el.textContent=m;el.classList.remove('hide')};
const norm=b=>{if(b.type&&!b.jr&&!b.jo){b[b.type.toLowerCase()]=b.no}delete b.type;delete b.no;b.jr=b.jr||'';b.jo=b.jo||'';return b};
const refs=b=>[b.jr?'JR '+b.jr:'',b.jo?'JO '+b.jo:''].filter(Boolean).join(' / ');

async function loadIndex(){
  const r=await api('bills.json');
  if(r.status===404)return {list:[],sha:null};
  if(!r.ok)throw new Error(r.status===401?'Token is wrong or expired.':r.status===403?'Token has no access to this repo.':'GitHub error '+r.status);
  const j=await r.json();
  return {list:JSON.parse(b642txt(j.content)).map(norm),sha:j.sha};
}
async function boot(){
  if(!cfg.repo||!cfg.tok){$('setup').classList.remove('hide');$('app').classList.add('hide');return}
  $('setup').classList.add('hide');$('cfgBtn').classList.remove('hide');
  try{const x=await loadIndex();bills=x.list;$('app').classList.remove('hide');fill();render()}
  catch(e){$('app').classList.add('hide');$('setup').classList.remove('hide');$('repo').value=cfg.repo;show($('setupMsg'),e.message)}
}
$('saveCfg').onclick=()=>{
  const repo=$('repo').value.trim().replace(/^https:\/\/github\.com\//,'').replace(/\/$/,''),tok=$('tok').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok){show($('setupMsg'),'Enter the repo as owner/name and paste the token.');return}
  cfg={repo,tok};localStorage.setItem('billsCfg',JSON.stringify(cfg));boot();
};
$('cfgBtn').onclick=()=>{$('repo').value=cfg.repo||'';$('tok').value='';$('setup').classList.toggle('hide')};

function uniq(k){return [...new Set(bills.map(b=>b[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function fill(){
  const keep=[$('fArea').value,$('fEng').value];
  $('fArea').innerHTML='<option value="">All areas</option>'+uniq('area').map(v=>`<option>${esc(v)}</option>`).join('');
  $('fEng').innerHTML='<option value="">All engineers</option>'+uniq('eng').map(v=>`<option>${esc(v)}</option>`).join('');
  $('fArea').value=keep[0];$('fEng').value=keep[1];
  $('dArea').innerHTML=uniq('area').map(v=>`<option value="${esc(v)}">`).join('');
  $('dEng').innerHTML=uniq('eng').map(v=>`<option value="${esc(v)}">`).join('');
}
function render(){
  const words=$('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const a=$('fArea').value,e=$('fEng').value,f=$('fFrom').value,to=$('fTo').value;
  const res=bills.filter(b=>{
